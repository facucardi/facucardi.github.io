<style>
  :root{
    --bg:#FAFBFB; --surface:#FFFFFF; --ink:#14201C; --muted:#5B6B66;
    --teal:#0D8B7E; --teal-deep:#0A5D54; --teal-ink:#06251F;
    --line:#E4EAE8; --line-2:#D2DCD9;
    --display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit}
  [hidden]{display:none!important}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

  /* HERO */
  .hero{background:var(--teal-ink);color:#EAF3F1;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(1200px 480px at 78% -12%,rgba(13,139,126,.35),transparent 60%)}
  .hero .wrap{position:relative;z-index:1;padding:40px 28px 64px}
  .topbar{display:flex;justify-content:flex-end;align-items:center;gap:22px;margin-bottom:88px;font-family:var(--mono);font-size:13px}
  .topbar a{color:#B9D4CE;transition:color .2s}
  .topbar a:hover{color:#fff}
  .lang{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:8px;overflow:hidden}
  .lang button{background:none;border:none;color:#B9D4CE;padding:5px 10px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
  .lang button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#fff}
  .hero h1{font-family:var(--display);font-weight:600;font-size:clamp(44px,8vw,84px);line-height:1;letter-spacing:-.025em;color:#fff;margin-bottom:44px}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13.5px;font-weight:500;
       padding:11px 18px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:.2s;background:none}
  .btn svg{width:15px;height:15px;flex:none}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:#12A092}
  .btn-ghost{border-color:rgba(255,255,255,.22);color:#DCEBE7}
  .btn-ghost:hover{border-color:#fff;color:#fff}

  /* SECCIONES + GRID */
  .section-head{margin:72px 0 24px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
  .section-head h2{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.01em}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 26px 20px;
        display:flex;flex-direction:column;transition:transform .22s ease,box-shadow .22s ease,border-color .22s}
  .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -24px rgba(6,37,31,.4);border-color:var(--line-2)}
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
  .tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
  .status{font-family:var(--mono);font-size:11px;letter-spacing:.04em;white-space:nowrap;
          padding:3px 9px;border-radius:999px;border:1px solid;display:inline-flex;align-items:center;gap:6px}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .st-live{color:#0A6E3F;border-color:#BFE3CF;background:#EEF8F2}
  .st-launch{color:#0A5D54;border-color:#BFE0DA;background:#ECF6F4}
  .st-dev{color:#8A4B12;border-color:#EBD3BC;background:#FBF3EA}
  .st-internal{color:#4B5A56;border-color:#D6DEDB;background:#F3F6F5}
  .card h3{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.01em;margin-bottom:2px}
  .org{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px}
  .what{color:#37453F;font-size:15.5px;margin-bottom:18px;flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
  .chip{font-family:var(--mono);font-size:11.5px;color:var(--teal-deep);background:#EAF4F2;border:1px solid #D8ECE8;border-radius:6px;padding:4px 9px}
  .card-actions{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:14px}
  .link-strong{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--teal-deep);display:inline-flex;align-items:center;gap:7px}
  .link-strong svg{width:14px;height:14px;transition:transform .2s}
  .card:hover .link-strong svg{transform:translateX(3px)}
  .icon-btn{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;
            cursor:pointer;background:none;border:none;padding:6px 4px;transition:color .2s}
  .icon-btn:hover{color:var(--teal-deep)}
  .icon-btn svg{width:14px;height:14px}

  /* CASO */
  .case{padding-top:44px;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .back{font-family:var(--mono);font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;margin-bottom:30px;cursor:pointer;background:none;border:none}
  .back:hover{color:var(--teal-deep)}
  .back svg{width:14px;height:14px}
  .case-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
  .case h1{font-family:var(--display);font-weight:600;font-size:clamp(32px,5vw,50px);letter-spacing:-.02em;line-height:1.05;margin-bottom:8px}
  .case-org{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:32px}
  .case-lede{font-size:20px;color:#2C3A35;max-width:740px;margin-bottom:40px;padding-bottom:40px;border-bottom:1px solid var(--line-2)}
  .field{display:grid;grid-template-columns:200px 1fr;gap:28px;padding:24px 0;border-bottom:1px solid var(--line)}
  .field:last-of-type{border-bottom:none}
  .field .k{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-deep);padding-top:3px}
  .field .v{font-size:16.5px;color:#2C3A35;max-width:660px}
  .field .v .chips{margin:0}
  .case-foot{margin:44px 0 0;display:flex;gap:12px;flex-wrap:wrap}
  .btn-solid{background:var(--teal);color:#fff}
  .btn-solid:hover{background:#12A092}
  .btn-outline{border:1px solid var(--line-2);color:var(--teal-deep)}
  .btn-outline:hover{border-color:var(--teal);background:#F1F8F6}

  /* FOOTER */
  footer{background:var(--teal-ink);color:#CFE3DE;margin-top:88px}
  footer .wrap{padding:48px 28px}
  .f-name{font-family:var(--display);font-weight:600;font-size:22px;color:#fff;margin-bottom:18px}
  .f-links{display:flex;flex-wrap:wrap;gap:22px;font-family:var(--mono);font-size:13.5px}
  .f-links a{color:#DCEBE7;border-bottom:1px solid transparent;transition:border-color .2s}
  .f-links a:hover{border-color:#DCEBE7}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--teal-ink);color:#EAF3F1;
    font-family:var(--mono);font-size:13px;padding:12px 20px;border-radius:10px;box-shadow:0 12px 30px -10px rgba(6,37,31,.6);transition:.3s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  :focus-visible{outline:2.5px solid var(--teal);outline-offset:3px;border-radius:4px}

  @media (max-width:720px){
    .grid{grid-template-columns:1fr}
    .field{grid-template-columns:1fr;gap:8px}
    .topbar{margin-bottom:56px;gap:16px}
    .topbar .hide-sm{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const UI = {
  es: { work: "Proyectos", personal: "Proyectos personales", case: "Ver caso", card: "Tarjeta", dlCard: "Descargar tarjeta",
        back: "Volver a proyectos", all: "Todos los proyectos", cv: "CV (PDF)", generating: "Generando…",
        cardOk: "Tarjeta descargada", cardErr: "No se pudo generar la tarjeta",
        f: { problem: "El problema", role: "Mi rol", solution: "La solución", stack: "Stack", result: "Resultado" },
        st: { prod: "En producción", launch: "En lanzamiento", daily: "En uso diario", delivered: "Entregado", dev: "En desarrollo", internal: "Uso interno", prototype: "Prototipo" } },
  en: { work: "Projects", personal: "Personal projects", case: "View case", card: "Card", dlCard: "Download card",
        back: "Back to projects", all: "All projects", cv: "Résumé (PDF)", generating: "Generating…",
        cardOk: "Card downloaded", cardErr: "Couldn't generate the card",
        f: { problem: "The problem", role: "My role", solution: "The solution", stack: "Stack", result: "Outcome" },
        st: { prod: "In production", launch: "Launching", daily: "Used daily", delivered: "Delivered", dev: "In development", internal: "Internal use", prototype: "Prototype" } }
};
const ST_CLASS = { prod: "st-live", daily: "st-live", launch: "st-launch", delivered: "st-launch", dev: "st-dev", prototype: "st-dev", internal: "st-internal" };

/* ---------- idioma: ?lang= > elección guardada > español ---------- */
function initialLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "es") return q;
  try { const s = localStorage.getItem("lang"); if (s === "en" || s === "es") return s; } catch(e){}
  return "es";
}
let LANG = initialLang();
function setLang(l){
  LANG = l;
  try { localStorage.setItem("lang", l); } catch(e){}
  const u = new URL(location.href);
  if (l === "en") u.searchParams.set("lang", "en"); else u.searchParams.delete("lang");
  history.replaceState(null, "", u.pathname + u.search + u.hash);
  route();
}

const app = document.getElementById("app");
const byId = id => PROJECTS.find(p => p.id === id);
const L = p => p[LANG];
const stackOf = p => (LANG === "en" && p.stackEn) ? p.stackEn : p.stack;
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const ICON = {
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>'
};

const chips = arr => '<div class="chips">' + arr.map(s => '<span class="chip">' + esc(s) + '</span>').join('') + '</div>';
const statusPill = p => `<span class="status ${ST_CLASS[p.status] || "st-internal"}">${esc(UI[LANG].st[p.status] || p.status)}</span>`;

function topbar(){
  return `<div class="topbar">
    <span class="lang" role="group" aria-label="Idioma / Language">
      <button data-lang="es" aria-pressed="${LANG === "es"}">ES</button><button data-lang="en" aria-pressed="${LANG === "en"}">EN</button>
    </span>
    <a class="hide-sm" href="${ME.github}" target="_blank" rel="noopener">GitHub</a>
    <a class="hide-sm" href="${ME.linkedin}" target="_blank" rel="noopener">LinkedIn</a>
    <a href="mailto:${ME.email}">Email</a>
  </div>`;
}

function cardHTML(p){
  const t = L(p), u = UI[LANG];
  return `<article class="card">
    <div class="card-top"><span class="tag">${esc(t.tag)}</span>${statusPill(p)}</div>
    <h3>${esc(t.name)}</h3>
    <div class="org">${esc(t.org)}</div>
    <p class="what">${esc(t.what)}</p>
    ${chips(stackOf(p))}
    <div class="card-actions">
      <a class="link-strong" href="#/p/${p.id}">${u.case} ${ICON.arrow}</a>
      <button class="icon-btn" data-card="${p.id}" aria-label="${esc(u.dlCard + ": " + t.name)}">${ICON.download} ${u.card}</button>
    </div>
  </article>`;
}

function renderHome(){
  const u = UI[LANG];
  const section = (group, title) => {
    const list = PROJECTS.filter(p => p.group === group);
    if (!list.length) return "";
    return `<div class="section-head"><h2>${title}</h2></div><div class="grid">${list.map(cardHTML).join("")}</div>`;
  };
  app.innerHTML = `
  <header class="hero"><div class="wrap">
    ${topbar()}
    <h1>Facundo<br>Cardinal</h1>
    <div class="cta-row">
      <a class="btn btn-primary" href="${ME.linkedin}" target="_blank" rel="noopener">${ICON.ext} LinkedIn</a>
      <a class="btn btn-ghost" href="${ME.github}" target="_blank" rel="noopener">${ICON.ext} GitHub</a>
      <a class="btn btn-ghost" id="cvBtn" href="${ME.cv[LANG]}" target="_blank" rel="noopener" hidden>${ICON.download} ${u.cv}</a>
    </div>
  </div></header>
  <main class="wrap">
    ${section("work", u.work)}
    ${section("personal", u.personal)}
  </main>
  ${footerHTML()}`;
  afterRender("Facundo Cardinal · Portfolio");
  revealCV();
}

function renderCase(id){
  const p = byId(id);
  if (!p) { location.hash = "#/"; return; }
  const t = L(p), u = UI[LANG];
  app.innerHTML = `
  <header class="hero"><div class="wrap" style="padding-bottom:28px">${topbar()}</div></header>
  <main class="wrap case">
    <button class="back" data-home>${ICON.back} ${u.back}</button>
    <div class="case-meta"><span class="tag">${esc(t.tag)}</span>${statusPill(p)}</div>
    <h1>${esc(t.name)}</h1>
    <div class="case-org">${esc(t.org)}</div>
    <p class="case-lede">${esc(t.what)}</p>
    <div class="field"><div class="k">${u.f.problem}</div><div class="v">${esc(t.problem)}</div></div>
    <div class="field"><div class="k">${u.f.role}</div><div class="v">${esc(t.role)}</div></div>
    <div class="field"><div class="k">${u.f.solution}</div><div class="v">${esc(t.solution)}</div></div>
    <div class="field"><div class="k">${u.f.stack}</div><div class="v">${chips(stackOf(p))}</div></div>
    <div class="field"><div class="k">${u.f.result}</div><div class="v">${esc(t.result)}</div></div>
    <div class="case-foot">
      <button class="btn btn-solid" data-card="${p.id}">${ICON.download} ${u.dlCard}</button>
      <button class="btn btn-outline" data-home>${ICON.back} ${u.all}</button>
    </div>
  </main>
  ${footerHTML()}`;
  afterRender(t.name + " · Facundo Cardinal");
}

function footerHTML(){
  return `<footer><div class="wrap">
    <div class="f-name">${ME.name}</div>
    <div class="f-links">
      <a href="${ME.linkedin}" target="_blank" rel="noopener">linkedin.com/in/facundocardinal</a>
      <a href="${ME.github}" target="_blank" rel="noopener">github.com/facucardi</a>
      <a href="mailto:${ME.email}">${ME.email}</a>
    </div>
  </div></footer>`;
}

function afterRender(title){
  document.title = title;
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-card]").forEach(b => b.addEventListener("click", () => downloadCard(b.dataset.card, b)));
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { if (b.dataset.lang !== LANG) setLang(b.dataset.lang); }));
  document.querySelectorAll("[data-home]").forEach(b => b.addEventListener("click", () => { location.hash = "#/"; }));
  window.scrollTo(0, 0);
}

/* El botón de CV solo aparece si el PDF existe en el sitio publicado */
async function revealCV(){
  const btn = document.getElementById("cvBtn");
  if (!btn || location.protocol === "file:") return;
  try {
    const r = await fetch(ME.cv[LANG], { method: "HEAD", cache: "no-store" });
    if (r.ok) btn.hidden = false;
  } catch(e){}
}

/* ---------- router ---------- */
function route(){
  const m = location.hash.replace(/^#/, "").match(/^\/p\/([\w-]+)$/);
  if (m) renderCase(m[1]); else renderHome();
}
window.addEventListener("hashchange", route);

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- tarjeta PNG (1080×1350, formato vertical para redes y chats) ---------- */
function buildCardNode(p){
  const t = L(p), u = UI[LANG];
  const nameSize = t.name.length > 20 ? 76 : 92;
  const node = document.createElement("div");
  node.style.cssText = "position:fixed;left:-10000px;top:0;width:1080px;height:1350px;box-sizing:border-box;overflow:hidden;" +
    "background:linear-gradient(160deg,#06251F 0%,#0A342C 60%,#0C4038 100%);color:#EAF3F1;padding:96px 88px;" +
    "display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif;";
  const chipHtml = stackOf(p).map(s => `<span style="font-family:'JetBrains Mono',monospace;font-size:24px;color:#8FE0D3;border:1px solid rgba(143,224,211,.4);border-radius:10px;padding:9px 18px;display:inline-block;margin:0 12px 12px 0;">${esc(s)}</span>`).join("");
  node.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:#12A092;">${esc(t.tag)}</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:22px;color:#EAF3F1;border:1px solid rgba(234,243,241,.35);border-radius:999px;padding:8px 20px;">${esc(u.st[p.status] || "")}</div>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:22px;color:#6FA79E;margin-bottom:52px;">${esc(t.org)}</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:${nameSize}px;line-height:1.02;letter-spacing:-.02em;color:#fff;margin-bottom:38px;">${esc(t.name)}</div>
    <div style="font-size:36px;line-height:1.42;color:#CFE3DE;margin-bottom:48px;">${esc(t.what)}</div>
    <div>${chipHtml}</div>
    <div style="margin-top:44px;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:24px;color:#8FE0D3;margin-bottom:8px;">${esc(u.f.role)}</div>
      <div style="font-size:29px;line-height:1.42;color:#DCEBE7;">${esc(t.role)}</div>
    </div>
    <div style="margin-top:auto;">
      <div style="height:1px;background:rgba(143,224,211,.25);margin-bottom:34px;"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:40px;">
        <div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:24px;color:#8FE0D3;margin-bottom:6px;">${esc(u.f.result)}</div>
          <div style="font-size:28px;line-height:1.35;color:#EAF3F1;max-width:600px;">${esc(t.result)}</div>
        </div>
        <div style="text-align:right;flex:none;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:34px;color:#fff;">${esc(ME.name)}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:22px;color:#6FA79E;">facucardi.github.io</div>
        </div>
      </div>
    </div>`;
  return node;
}

async function downloadCard(id, btn){
  const p = byId(id); if (!p) return;
  const u = UI[LANG], original = btn.innerHTML;
  if (typeof html2canvas !== "function") { toast(u.cardErr); return; }
  btn.disabled = true; btn.innerHTML = ICON.download + " " + u.generating;
  const node = buildCardNode(p);
  document.body.appendChild(node);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 120));
    const canvas = await html2canvas(node, { scale: 1, backgroundColor: "#06251F", logging: false, width: 1080, height: 1350 });
    const a = document.createElement("a");
    a.download = `Facundo-Cardinal_${p.id}_${LANG}.png`;
    a.href = canvas.toDataURL("image/png");
    document.body.appendChild(a); a.click(); a.remove();
    toast(u.cardOk);
  } catch(e) {
    console.error(e); toast(u.cardErr);
  } finally {
    node.remove(); btn.disabled = false; btn.innerHTML = original;
  }
}

route();
</script>
